<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">全球认证华文教师网络待上线流程</title><desc id="desc">教师申请、资质验证、培训试批、分级接单和持续质量审核。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f2fb"/><stop offset="1" stop-color="#edf8f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69599b"/></marker></defs>
  <rect width="1400" height="640" rx="32" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif" fill="#26332d">
    <text x="700" y="70" text-anchor="middle" font-size="38" font-weight="800" fill="#5d4b92">全球认证华文教师网络 · 待上线</text>
    <text x="700" y="106" text-anchor="middle" font-size="18" fill="#686c6a">Verified global Chinese teacher network · COMING SOON</text>
    <g filter="url(#s)">
      <rect x="50" y="170" width="235" height="285" rx="24" fill="#fff" stroke="#d9d2e9" stroke-width="2"/><rect x="315" y="170" width="235" height="285" rx="24" fill="#fff" stroke="#d9d2e9" stroke-width="2"/><rect x="580" y="170" width="235" height="285" rx="24" fill="#fff8df" stroke="#ddc36f" stroke-width="2"/><rect x="845" y="170" width="235" height="285" rx="24" fill="#eaf7f0" stroke="#9fcfbe" stroke-width="2"/><rect x="1110" y="170" width="235" height="285" rx="24" fill="#fff" stroke="#d9d2e9" stroke-width="2"/>
    </g>
    <text x="167" y="230" text-anchor="middle" font-size="43">🌍</text><text x="167" y="280" text-anchor="middle" font-size="24" font-weight="800">全球教师申请</text><text x="167" y="322" text-anchor="middle" font-size="16">身份 · 学历 · 经历</text><text x="167" y="352" text-anchor="middle" font-size="16">国家/地区教师资格</text><text x="167" y="382" text-anchor="middle" font-size="16">中文、IB、PGCE/PGDE</text>
    <text x="432" y="230" text-anchor="middle" font-size="43">🔎</text><text x="432" y="280" text-anchor="middle" font-size="24" font-weight="800">资质核验</text><text x="432" y="322" text-anchor="middle" font-size="16">签发机构与有效期</text><text x="432" y="352" text-anchor="middle" font-size="16">身份及背景检查</text><text x="432" y="382" text-anchor="middle" font-size="16">儿童安全准入</text>
    <text x="697" y="230" text-anchor="middle" font-size="43">🧑‍🏫</text><text x="697" y="280" text-anchor="middle" font-size="24" font-weight="800">培训与试批</text><text x="697" y="322" text-anchor="middle" font-size="16">双语反馈规范</text><text x="697" y="352" text-anchor="middle" font-size="16">模拟作文批改</text><text x="697" y="382" text-anchor="middle" font-size="16">导师审核与试用期</text>
    <text x="962" y="230" text-anchor="middle" font-size="43">📚</text><text x="962" y="280" text-anchor="middle" font-size="24" font-weight="800">分级接单</text><text x="962" y="322" text-anchor="middle" font-size="16">实习批改员</text><text x="962" y="352" text-anchor="middle" font-size="16">认证教师</text><text x="962" y="382" text-anchor="middle" font-size="16">资深导师</text>
    <text x="1227" y="230" text-anchor="middle" font-size="43">🛡️</text><text x="1227" y="280" text-anchor="middle" font-size="24" font-weight="800">持续质量审核</text><text x="1227" y="322" text-anchor="middle" font-size="16">抽查 · 申诉 · 评分</text><text x="1227" y="352" text-anchor="middle" font-size="16">续证与重新核验</text><text x="1227" y="382" text-anchor="middle" font-size="16">不合格暂停接单</text>
    <path d="M285 310H305" stroke="#69599b" stroke-width="4" marker-end="url(#a)"/><path d="M550 310H570" stroke="#69599b" stroke-width="4" marker-end="url(#a)"/><path d="M815 310H835" stroke="#69599b" stroke-width="4" marker-end="url(#a)"/><path d="M1080 310H1100" stroke="#69599b" stroke-width="4" marker-end="url(#a)"/>
    <rect x="185" y="505" width="1030" height="77" rx="22" fill="#5d4b92"/><text x="700" y="538" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">平台原则：教师不为“接单资格”付费；会员费购买效率工具、培训和职业成长服务</text><text x="700" y="566" text-anchor="middle" font-size="16" fill="#eee9fa">Teacher membership supports professional tools—not access to children or guaranteed orders.</text>
  </g>
</svg>
