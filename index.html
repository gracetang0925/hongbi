<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华文写作批改工具</title>
<style>
:root {
  --teal:#0F6E56; --teal-light:#e6f4f1; --teal-dark:#0a5240;
  --gold:#B8860B; --gold-light:#fef7e0;
  --purple:#534AB7; --purple-light:#EEEDFE;
  --red:#c0392b; --red-light:#fff0f0;
  --green:#27ae60; --green-light:#eef8f2;
  --blue:#2980b9; --blue-light:#edf4fa;
  --bg:#f8f7f4; --card:#fff; --text:#1a1a1a; --muted:#888; --border:#e8e4dd;
  --shadow:0 4px 20px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.wrapper{max-width:800px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}

.header{text-align:center;margin-bottom:2rem;}
.header h1{font-size:1.9rem;font-weight:700;color:var(--teal);letter-spacing:.04em;margin-bottom:.3rem;}
.header p{color:var(--muted);font-size:.9rem;}

/* Student bar */
.student-bar{display:flex;gap:.8rem;align-items:center;margin-bottom:1.5rem;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.9rem 1.2rem;}
.student-bar label{font-size:.85rem;color:var(--muted);white-space:nowrap;}
.student-input{flex:1;border:none;outline:none;font-family:inherit;font-size:.95rem;background:transparent;color:var(--text);}
.student-input::placeholder{color:#bbb;}

/* Mode tabs */
.mode-tabs{display:flex;gap:.6rem;margin-bottom:1.4rem;flex-wrap:wrap;}
.mode-tab{flex:1;min-width:130px;padding:.8rem .9rem;border:2px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;font-size:.88rem;font-family:inherit;text-align:center;transition:all .2s;color:var(--muted);}
.mode-tab .tab-icon{font-size:1.3rem;display:block;margin-bottom:.2rem;}
.mode-tab .tab-desc{font-size:.74rem;margin-top:.15rem;opacity:.8;}
.mode-tab.active-teal  {border-color:var(--teal);  background:var(--teal-light);  color:var(--teal);  font-weight:600;}
.mode-tab.active-gold  {border-color:var(--gold);  background:var(--gold-light);  color:var(--gold);  font-weight:600;}
.mode-tab.active-purple{border-color:var(--purple);background:var(--purple-light);color:var(--purple);font-weight:600;}

/* Samples */
.sample-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap;}
.sample-label{font-size:.82rem;color:var(--muted);white-space:nowrap;}
.sample-btn{padding:.3rem .75rem;font-size:.79rem;border:1.5px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-family:inherit;color:var(--text);transition:all .2s;}
.sample-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light);}

/* Input */
.input-wrap{position:relative;margin-bottom:1rem;}
.input-label{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--muted);margin-bottom:.4rem;}
textarea{width:100%;min-height:180px;padding:1rem 1rem 3.2rem 1rem;font-family:inherit;font-size:1rem;line-height:1.85;border:2px solid var(--border);border-radius:12px;background:var(--card);resize:vertical;transition:border-color .2s;color:var(--text);}
textarea:focus{outline:none;border-color:var(--teal);}
.camera-btn{position:absolute;bottom:.7rem;right:.7rem;display:flex;align-items:center;gap:.4rem;padding:.45rem .9rem;background:var(--teal);color:#fff;border:none;border-radius:20px;font-size:.8rem;font-family:inherit;cursor:pointer;transition:background .2s;}
.camera-btn:hover{background:var(--teal-dark);}

/* Buttons */
.submit-row{display:flex;gap:.7rem;margin-bottom:1.2rem;}
.submit-btn{flex:1;padding:.9rem;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s,transform .1s;}
.submit-btn:hover{background:var(--teal-dark);}
.submit-btn:active{transform:scale(.98);}
.submit-btn:disabled{background:#aaa;cursor:not-allowed;}
.clear-btn{padding:.9rem 1.3rem;border:2px solid var(--border);border-radius:12px;background:var(--card);color:var(--muted);font-size:.9rem;font-family:inherit;cursor:pointer;transition:all .2s;}
.clear-btn:hover{border-color:#bbb;color:var(--text);}

/* Error / loading / result */
.error-msg{display:none;padding:.75rem 1rem;background:var(--red-light);border:1.5px solid #f5c6c6;border-radius:10px;color:var(--red);font-size:.88rem;margin-bottom:1rem;}
.loading{display:none;text-align:center;padding:2rem;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:1.5rem;}
.loading.visible{display:block;}
.brush-anim{font-size:2.5rem;animation:bounce 1s infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.loading-text{margin-top:.8rem;color:var(--muted);font-size:.9rem;}
.result-section{display:none;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.result-section.visible{display:block;}
.result-header{display:flex;align-items:center;padding:1rem 1.3rem;border-bottom:1px solid var(--border);gap:.7rem;}
.mode-badge{display:inline-block;padding:.3rem .8rem;border-radius:20px;font-size:.82rem;font-weight:600;}
.badge-teal  {background:var(--teal-light);  color:var(--teal);}
.badge-gold  {background:var(--gold-light);  color:var(--gold);}
.badge-purple{background:var(--purple-light);color:var(--purple);}
.result-content{padding:1.3rem 1.5rem;font-size:.97rem;line-height:1.9;}
.result-content h3{color:var(--teal);margin:1.1rem 0 .4rem;font-size:.95rem;}
.result-content strong{color:#333;}
.error-highlight{background:var(--red-light);color:var(--red);border-radius:3px;padding:0 2px;}
.suggestion{color:var(--teal);margin:.2rem 0;}
.praise{color:var(--green);margin:.2rem 0;}
.score-row{display:none;gap:.8rem;padding:1rem 1.5rem;border-top:1px solid var(--border);flex-wrap:wrap;}
.score-row.visible{display:flex;}
.score-note{flex-basis:100%;padding:.55rem .7rem;border-radius:9px;background:var(--gold-light);color:#7d6118;font-size:.75rem;line-height:1.5;}
.score-chip{flex:1;min-width:85px;text-align:center;padding:.6rem;background:var(--bg);border-radius:10px;}
.score-label{font-size:.75rem;color:var(--muted);}
.score-val{font-size:1.5rem;font-weight:700;color:var(--teal);}
.action-row{display:flex;gap:.6rem;padding:.9rem 1.3rem;border-top:1px solid var(--border);flex-wrap:wrap;}
.action-pill{padding:.4rem .9rem;border:1.5px solid var(--border);border-radius:20px;background:transparent;font-size:.82rem;font-family:inherit;cursor:pointer;color:var(--text);transition:all .2s;}
.action-pill:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light);}
.action-pill.green{border-color:var(--green);color:var(--green);}
.action-pill.green:hover{background:var(--green-light);}

/* Teacher annotations */
.teacher-section{display:none;margin-top:1rem;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.teacher-section.visible{display:block;}
.teacher-header{background:var(--gold-light);padding:1rem 1.3rem;border-bottom:1px solid #f0d060;display:flex;align-items:center;gap:.6rem;}
.teacher-header span:first-child{font-size:1.1rem;}
.teacher-header strong{color:var(--gold);font-size:.95rem;}
.teacher-body{padding:1.2rem 1.5rem;}
.anno-item{background:var(--bg);border-radius:10px;padding:.75rem 1rem;margin-bottom:.6rem;border-left:3px solid var(--border);font-size:.9rem;line-height:1.7;}
.anno-tag{display:inline-block;padding:.1rem .55rem;border-radius:8px;font-size:.74rem;font-weight:600;margin-bottom:.3rem;}
.tag-语用{background:var(--purple-light);color:var(--purple);border-left-color:var(--purple);}
.tag-逻辑{background:var(--gold-light);color:var(--gold);}
.tag-文化{background:var(--red-light);color:var(--red);}
.tag-鼓励{background:var(--green-light);color:var(--green);}
.tag-其他{background:var(--blue-light);color:var(--blue);}

/* Draft 2 */
.draft2-section{display:none;margin-top:1.5rem;}
.draft2-section.visible{display:block;}
.draft2-header{display:flex;align-items:center;gap:.7rem;padding:1rem 1.3rem;background:var(--green-light);border:1.5px solid #b5e2c8;border-radius:12px 12px 0 0;}
.draft2-header span{font-weight:600;color:var(--green);font-size:.95rem;}
.draft2-body{background:var(--card);border:1.5px solid #b5e2c8;border-top:none;border-radius:0 0 12px 12px;padding:1.2rem;}
.draft2-body textarea{min-height:150px;border-color:#b5e2c8;margin-bottom:.8rem;padding:1rem;}
.draft2-body textarea:focus{border-color:var(--green);}
.draft2-submit{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;font-family:inherit;cursor:pointer;}
.draft2-submit:hover{background:#1e8449;}
.draft2-submit:disabled{background:#aaa;}

/* Growth comparison */
.comparison{display:none;margin-top:1.2rem;}
.comparison.visible{display:block;}
.comp-box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:1.3rem 1.5rem;}
.comp-title{font-size:.9rem;font-weight:600;margin-bottom:1rem;text-align:center;}
.comp-row{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem;font-size:.85rem;}
.comp-label{width:50px;text-align:right;color:var(--muted);font-size:.8rem;}
.comp-bars{flex:1;display:flex;flex-direction:column;gap:.25rem;}
.bar-wrap{display:flex;align-items:center;gap:.4rem;}
.bar-tag{width:34px;font-size:.7rem;color:var(--muted);}
.bar-bg{flex:1;height:9px;background:#f0ece6;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .8s ease;}
.b1{background:#94c4ba;}.b2{background:var(--teal);}
.bar-num{width:28px;font-size:.8rem;color:var(--teal);font-weight:600;}
.comp-delta{padding:.15rem .55rem;border-radius:10px;font-size:.8rem;}
.delta-up{background:#d4edda;color:#155724;}
.delta-same{background:#f0ece6;color:var(--muted);}
.delta-down{background:var(--red-light);color:var(--red);}
.comp-summary{text-align:center;margin-top:.8rem;font-size:.88rem;padding:.7rem;background:var(--teal-light);border-radius:10px;color:var(--teal);font-weight:500;}

/* Child learning companion and local garden rewards */
.garden-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:-.7rem 0 1.35rem;padding:.8rem 1rem;background:linear-gradient(135deg,#fffdf7,#eef8f2);border:1px solid #d9e8df;border-radius:16px;box-shadow:0 5px 16px rgba(76,58,42,.05);}
.garden-copy{display:flex;align-items:center;gap:.65rem;min-width:0;}
.garden-copy>span{font-size:1.5rem;}.garden-copy strong{display:block;font-size:.86rem;color:var(--teal);}.garden-copy small{display:block;color:var(--muted);font-size:.7rem;}
.garden-stats{display:flex;gap:.45rem;white-space:nowrap;}.reward-pill{padding:.38rem .62rem;background:#fff;border:1px solid var(--border);border-radius:999px;font-size:.78rem;color:#5c675f;}.reward-pill b{color:var(--teal);}
.learning-goal{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:-.7rem 0 1.25rem;padding:.35rem;background:#f1ece4;border-radius:14px;}.goal-btn{padding:.7rem .8rem;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);font:600 .82rem/1.35 inherit;cursor:pointer;}.goal-btn span{display:block;font-size:.68rem;font-weight:400;}.goal-btn.active{background:#fff;border-color:var(--border);color:var(--teal);box-shadow:0 3px 10px rgba(76,58,42,.07);}.goal-btn.active-hsk{background:var(--gold-light);border-color:#ead39a;color:#8a6510;}
.reward-toast{position:fixed;left:50%;bottom:1.5rem;z-index:1100;transform:translate(-50%,18px);padding:.7rem 1rem;background:#26332d;color:#fff;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
.reward-toast.visible{opacity:1;transform:translate(-50%,0);}
.pet-summary{display:grid;grid-template-columns:54px 1fr;gap:.85rem;align-items:start;margin:.7rem 0 1rem;padding:1rem;background:var(--teal-light);border:1px solid #c9e1d9;border-radius:14px;}
.pet-avatar{display:grid;place-items:center;width:52px;height:52px;border:2px solid var(--teal);border-radius:50%;background:#fff;font-weight:800;color:var(--teal);font-size:1.05rem;box-shadow:inset 0 -5px 0 rgba(43,113,100,.07);}
.pet-summary strong{display:block;margin-bottom:.25rem;color:var(--teal);}.pet-summary p{font-size:.86rem;line-height:1.65;color:#45564e;}
.strength-card{margin:.8rem 0;padding:.9rem 1rem;background:var(--green-light);border-left:4px solid var(--green);border-radius:10px;color:#315d49;}
.strength-card strong{display:block;color:var(--green);}.strength-en{display:block;margin-top:.25rem;color:#587066;font-size:.82rem;}
.error-list{display:grid;gap:.9rem;margin-top:.7rem;}.error-card{padding:1rem;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(76,58,42,.04);}
.error-card-head{display:flex;align-items:center;gap:.45rem;margin-bottom:.7rem;}.error-number{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--red-light);color:var(--red);font-size:.72rem;font-weight:800;}.error-type{padding:.18rem .5rem;border-radius:7px;background:#f6f1e9;color:#755f4e;font-size:.72rem;font-weight:700;}.error-type-en{font-size:.7rem;color:var(--muted);}
.correction-row{display:grid;grid-template-columns:1fr auto 1fr;gap:.55rem;align-items:center;}.correction-box{padding:.65rem .75rem;border-radius:9px;background:#f8f5ef;}.correction-box.corrected{background:var(--teal-light);}.correction-box small{display:block;margin-bottom:.15rem;color:var(--muted);font-size:.66rem;}.correction-box p{font-size:.9rem;line-height:1.55;}.correction-arrow{color:var(--red);font-weight:800;}
.reason-card{margin-top:.7rem;padding:.75rem .85rem;border-radius:10px;background:#fbfaf7;font-size:.84rem;line-height:1.65;}.reason-card b{color:#38453f;}.reason-en{margin-top:.35rem;color:#53645c;}
.pet-tip{display:flex;gap:.5rem;margin-top:.65rem;color:var(--teal);font-size:.8rem;line-height:1.55;}.pet-tip span:first-child{font-weight:800;}
.pinyin-toggle{margin-top:.7rem;padding:.42rem .7rem;border:1px solid #bfd8d0;border-radius:9px;background:#fff;color:var(--teal);font:600 .78rem/1.2 inherit;cursor:pointer;}.pinyin-toggle:hover{background:var(--teal-light);}.pinyin-panel{margin-top:.45rem;padding:.6rem .75rem;border-radius:9px;background:#edf3fb;color:#3b6394;font-size:.86rem;letter-spacing:.02em;}.pinyin-panel[hidden]{display:none;}
.no-errors{padding:1rem;background:var(--green-light);border:1px dashed #a8d2bd;border-radius:12px;color:var(--green);font-size:.88rem;}
.growth-result{text-align:center;padding:.5rem;}.growth-icon{font-size:2.2rem;display:block;margin-bottom:.35rem;}.growth-result strong{display:block;color:var(--teal);font-size:1rem;}.growth-result p{margin-top:.25rem;color:var(--muted);font-size:.84rem;}

/* Camera modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.visible{display:flex;}
.modal-box{background:var(--card);border-radius:20px;padding:1.5rem;width:min(90vw,500px);}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);}
#cameraVideo{width:100%;border-radius:12px;background:#000;display:block;}
#cameraPreview{display:none;width:100%;border-radius:12px;margin-top:.8rem;}
.cam-btns{display:flex;gap:.7rem;margin-top:1rem;}
.cam-btn{flex:1;padding:.75rem;border:none;border-radius:10px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;}
.cam-snap{background:var(--teal);color:#fff;}
.cam-retake{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
.cam-use{background:var(--green);color:#fff;}
.cam-cancel{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}
.cam-status{text-align:center;font-size:.84rem;color:var(--muted);margin-top:.6rem;}
.cam-loading{text-align:center;padding:.8rem;color:var(--teal);font-size:.88rem;display:none;}

.footer{text-align:center;margin-top:3rem;color:var(--muted);font-size:.78rem;}

/* HongBi learner-friendly visual refresh — CSS only */
:root{
  --teal:#2b7164;--teal-light:#e8f3ef;--teal-dark:#21584e;
  --gold:#b27a13;--gold-light:#fff5d6;
  --purple:#6d5db7;--purple-light:#f1eeff;
  --red:#c84a3d;--red-light:#fff0ed;
  --green:#2f8f68;--green-light:#eaf7f0;
  --blue:#4b78b8;--blue-light:#edf3fb;
  --bg:#fff9f2;--card:#fff;--text:#26332d;--muted:#66736c;--border:#e5ded3;
  --shadow:0 12px 32px rgba(76,58,42,.09);
}
body{
  font-family:'Nunito Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  line-height:1.65;
  background:radial-gradient(circle at 12% 3%,rgba(200,74,61,.08),transparent 26rem),radial-gradient(circle at 90% 12%,rgba(43,113,100,.07),transparent 28rem),var(--bg);
}
.wrapper{max-width:860px;padding:2.5rem 1.5rem 5rem;}
.header{margin-bottom:2.2rem;}
.header h1{color:var(--red);font-size:2.1rem;font-weight:800;letter-spacing:.02em;}
.header p{font-size:.95rem;line-height:1.7;}
.student-bar{border:1px solid var(--border);border-radius:16px;padding:1rem 1.2rem;box-shadow:0 5px 18px rgba(76,58,42,.05);}
.student-bar:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,74,61,.1);}
.student-input{font-size:1rem;}
.mode-tab{min-height:92px;border-width:1.5px;border-radius:16px;padding:.9rem;box-shadow:0 4px 14px rgba(76,58,42,.04);}
.mode-tab:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(76,58,42,.08);}
.mode-tab .tab-icon{font-size:1.45rem;}
.sample-btn{min-height:36px;padding:.4rem .8rem;border-width:1px;}
textarea{min-height:240px;border-width:1.5px;border-radius:16px;font-size:1.05rem;line-height:2;box-shadow:inset 0 1px 4px rgba(76,58,42,.03);}
textarea:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,74,61,.1);}
.camera-btn{min-height:44px;padding:.55rem 1rem;background:var(--teal);}
.submit-btn{min-height:52px;background:var(--red);border-radius:14px;font-weight:700;box-shadow:0 7px 16px rgba(200,74,61,.2);}
.submit-btn:hover{background:#a63d32;}
.clear-btn{min-height:52px;border-width:1px;border-radius:14px;}
.loading,.result-section,.teacher-section,.comp-box{border:1px solid var(--border);border-radius:20px;}
.result-header{background:#fffdf9;}
.score-chip{border:1px solid var(--border);border-radius:12px;}
.action-pill{min-height:44px;border-width:1px;border-radius:12px;background:#fff;}
.draft2-header{border-radius:16px 16px 0 0;}
.draft2-body{border-radius:0 0 16px 16px;}
.draft2-submit,.cam-btn{min-height:48px;border-radius:12px;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(200,74,61,.24);outline-offset:2px;}
@media (max-width:620px){
  .wrapper{padding:1.5rem .9rem 3rem;}.header h1{font-size:1.75rem}.mode-tabs{display:grid;grid-template-columns:1fr}.mode-tab{min-height:76px}.submit-row{flex-direction:column}.clear-btn{width:100%}.action-pill{flex:1 1 calc(50% - .6rem)}.garden-bar{align-items:flex-start;flex-direction:column}.garden-stats{align-self:stretch}.reward-pill{flex:1;text-align:center}.correction-row{grid-template-columns:1fr}.correction-arrow{transform:rotate(90deg);justify-self:center}.pet-summary{grid-template-columns:44px 1fr}.pet-avatar{width:44px;height:44px}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>红笔 HongBi · 儿童华文写作</h1>
    <p>小墨陪你发现问题、看懂原因，再亲手把作文写得更好。</p>
  </div>

  <div class="garden-bar" aria-label="我的写作菜园">
    <div class="garden-copy"><span>🌱</span><div><strong>我的写作菜园</strong><small>完成写作得种子，查看拼音得水滴</small></div></div>
    <div class="garden-stats">
      <span class="reward-pill">🌰 种子 <b id="seedCount">0</b></span>
      <span class="reward-pill">💧 水滴 <b id="waterCount">0</b></span>
    </div>
  </div>

  <div class="learning-goal" aria-label="选择学习目标">
    <button type="button" class="goal-btn active" id="goal-child" onclick="setLearningGoal('child')" aria-pressed="true">🌱 儿童成长模式<span>不评分，专注理解与修改</span></button>

<script>
const WORKER_URL = "https://chinese-feedback-proxy.tangxiazhen94.workers.dev";
const SESSION_ID = Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const SAMPLES = [
  `我的家庭有四个人。我的爸爸是一个医生，他每天都很忙。我的妈妈在家里工作，她很爱我。我有一个哥哥，他比我大三岁，我们经常一起玩游戏。我很爱我的家庭，我们的关系很好。周末的时候，我们一家人会去公园散步或者去餐厅吃饭。`,
  `环境保护是现在很重要的问题。因为人们使用太多的塑料和浪费很多水，所以环境变得很差。我们应该减少使用塑料袋，改用环保的袋子。另外，我们也要节约用水，不要开着水龙头刷牙。如果每个人都做一点点，地球会变得更好。`,
  `随着城市化的快速发展，越来越多的人选择在城市生活。城市给人们提供了更多的就业机会和方便的生活设施，但同时也带来了一些问题，比如交通堵塞、空气污染和生活节奏太快。我认为城市和农村各有优点，最重要的是找到适合自己的生活方式。`
];

const MODES = {
  ai:      { label:'🐼 小墨 AI 反馈', badge:'badge-teal' },
  teacher: { label:'👩‍🏫 教师式反馈', badge:'badge-gold' },
  hybrid:  { label:'🤝 人机协同', badge:'badge-purple' },
};

let currentMode = 'ai';
let currentGoal = 'child';
let draft1Feedback = null;
let draft2Feedback = null;
let cameraStream = null;
let capturedImage = null;
let currentSubId = null;
let rewardToastTimer = null;

const REWARD_KEY = 'hongbiGardenRewardsV1';
let gardenRewards = loadGardenRewards();

function loadGardenRewards() {
  try {
    const saved = JSON.parse(localStorage.getItem(REWARD_KEY) || '{}');
    return {
      seeds: Number.isFinite(saved.seeds) ? saved.seeds : 0,
      water: Number.isFinite(saved.water) ? saved.water : 0,
      claimed: Array.isArray(saved.claimed) ? saved.claimed.slice(-200) : [],
    };
  } catch {
    return { seeds:0, water:0, claimed:[] };
  }
}

function saveGardenRewards() {
  try { localStorage.setItem(REWARD_KEY, JSON.stringify(gardenRewards)); } catch {}
}

function updateGardenUI() {
  document.getElementById('seedCount').textContent = gardenRewards.seeds;
  document.getElementById('waterCount').textContent = gardenRewards.water;
}

function showRewardToast(message) {
  const toast = document.getElementById('rewardToast');
  toast.textContent = message;
  toast.classList.add('visible');
  clearTimeout(rewardToastTimer);
  rewardToastTimer = setTimeout(()=>toast.classList.remove('visible'), 2600);
}

function awardLocalReward(kind, amount, claimId, message) {
  const fullClaimId = `${SESSION_ID}:${claimId}`;
  if (gardenRewards.claimed.includes(fullClaimId)) return false;
  gardenRewards.claimed.push(fullClaimId);
  gardenRewards[kind] += amount;
  saveGardenRewards();
  updateGardenUI();
  showRewardToast(message);
  return true;
}

function togglePinyin(button, rewardId) {
  const panel = button.nextElementSibling;
  const willOpen = panel.hidden;
  panel.hidden = !willOpen;
  button.setAttribute('aria-expanded', String(willOpen));
  button.textContent = willOpen ? '收起拼音' : '🔤 显示拼音';
  if (willOpen) awardLocalReward('water', 1, `pinyin:${rewardId}`, '💧 你认真查看了拼音，获得 1 滴水！');
}

function setLearningGoal(goal) {
  currentGoal = goal === 'hsk' ? 'hsk' : 'child';
  ['child','hsk'].forEach(name => {
    const button = document.getElementById(`goal-${name}`);
    const active = name === currentGoal;
    button.className = `goal-btn${active ? (name === 'hsk' ? ' active active-hsk' : ' active') : ''}`;
    button.setAttribute('aria-pressed', String(active));
  });
  updateGoalResults();
}

function getScores(feedback) {
  const scores = feedback?.macro?.scores;
  if (!scores) return null;
  return [
    { label:'准确性', val:scores.accuracy },
    { label:'流利度', val:scores.fluency },
    { label:'内容', val:scores.content },
  ];
}

function renderScoreCards(feedback) {
  const scores = getScores(feedback);
  if (!scores) return '';
  return `<div class="score-note">HSK 备考参考：这是 AI 生成的模拟练习评分，用来观察修改方向，不是官方 HSK 成绩。</div>${scores.map(score => `<div class="score-chip"><div class="score-label">${score.label}</div><div class="score-val">${score.val}<span style="font-size:13px;font-weight:400;">/10</span></div></div>`).join('')}`;
}

function updateGoalResults() {
  [['scoreRow',draft1Feedback],['scoreRow2',draft2Feedback]].forEach(([id, feedback]) => {
    const row = document.getElementById(id);
    if (currentGoal === 'hsk' && feedback) {
      row.innerHTML = renderScoreCards(feedback);
      row.classList.add('visible');
    } else {
      row.classList.remove('visible');
      row.innerHTML = '';
    }
  });
  if (draft1Feedback && draft2Feedback) {
    if (currentGoal === 'hsk') showScoreComparison(draft1Feedback, draft2Feedback);
    else showGrowthComparison(draft1Feedback, draft2Feedback);
  }
}

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-tab').forEach(t => { t.className = 'mode-tab'; t.setAttribute('aria-pressed', 'false'); });
  const map = { ai:'active-teal', teacher:'active-gold', hybrid:'active-purple' };
  const activeTab = document.getElementById('tab-'+m);
  activeTab.classList.add(map[m]);
  activeTab.setAttribute('aria-pressed', 'true');
}
function loadSample(i) { document.getElementById('essayInput').value = SAMPLES[i]; updateCount(); }
function updateCount()  { document.getElementById('charCount').textContent  = document.getElementById('essayInput').value.length + ' 字'; }
function updateCount2() { document.getElementById('charCount2').textContent = document.getElementById('essay2Input').value.length + ' 字'; }
function showError(m)   { const e=document.getElementById('errorMsg'); e.textContent=m; e.style.display='block'; }
function hideError()    { document.getElementById('errorMsg').style.display='none'; }
function showDraft2()   { document.getElementById('draft2Section').classList.add('visible'); document.getElementById('draft2Section').scrollIntoView({behavior:'smooth'}); }

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  })[ch]);
}

function renderFeedback(feedback, draft) {
  const macro = feedback.macro;
  const errors = feedback.micro || [];
  const typeEnglish = {
    '语序':'Word order', '量词':'Measure word', '体标记（了/过/着）':'Aspect marker',
    '语体':'Register', '搭配':'Collocation'
  };
  const microHtml = errors.length
    ? `<div class="error-list">${errors.map((item, index) => {
        const explanationZh = item.explanation_zh || item.explanation || '';
        const explanationEn = item.explanation_en || 'This part needs a small change to sound natural in Chinese.';
        const typeEn = item.type_en || typeEnglish[item.type] || 'Language use';
        const pinyin = item.pinyin || '拼音提示正在准备中。';
        const petHint = item.pet_hint || `小墨发现“${item.original}”可以说得更自然。你愿意试着改一改吗？`;
        return `<article class="error-card">
          <div class="error-card-head"><span class="error-number">${index + 1}</span><span class="error-type">${escapeHtml(item.type)}</span><span class="error-type-en" lang="en">${escapeHtml(typeEn)}</span></div>
          <div class="correction-row">
            <div class="correction-box"><small>你的原文</small><p>${escapeHtml(item.original)}</p></div>
            <span class="correction-arrow">→</span>
            <div class="correction-box corrected"><small>可以这样写</small><p>${escapeHtml(item.correction)}</p></div>
          </div>
          <div class="reason-card"><b>为什么？</b><div>${escapeHtml(explanationZh)}</div><div class="reason-en" lang="en"><b>Why?</b> ${escapeHtml(explanationEn)}</div></div>
          <div class="pet-tip"><span>墨</span><span>${escapeHtml(petHint)}</span></div>
          <button type="button" class="pinyin-toggle" aria-expanded="false" onclick="togglePinyin(this,'${draft}-${index}')">🔤 显示拼音</button>
          <div class="pinyin-panel" hidden><b>Pinyin</b> · ${escapeHtml(pinyin)}</div>
        </article>`;
      }).join('')}</div>`
    : '<div class="no-errors">🌟 小墨没有发现需要优先修改的语言问题。继续保持清楚、自然的表达！</div>';

  return `<section>
      <div class="pet-summary"><div class="pet-avatar">墨</div><div><strong>小墨读完啦！</strong><p>${escapeHtml(macro.summary)}</p><p>${escapeHtml(macro.encouragement || '你已经完成了很重要的一步，我们一起看看怎样写得更清楚。')}</p></div></div>
      <h3>写得好的地方 · What works well</h3>
      <div class="strength-card"><strong>✓ ${escapeHtml(macro.strengths)}</strong><span class="strength-en" lang="en">${escapeHtml(macro.strengths_en || 'You communicated your idea clearly.')}</span></div>
      <h3>文章整体 · The big picture</h3>
      <p><strong>内容：</strong>${escapeHtml(macro.content)}<br><strong>结构：</strong>${escapeHtml(macro.structure)}<br><strong>连贯性：</strong>${escapeHtml(macro.coherence)}</p>
    </section>
    <section><h3>小墨发现的问题 · Let's revise</h3>${microHtml}</section>`;
}

async function getFeedback(draft) {
  const essay = draft===1 ? document.getElementById('essayInput').value.trim() : document.getElementById('essay2Input').value.trim();
  const studentName = document.getElementById('studentName').value.trim();
  if (!studentName) { showError('请先填写姓名或学号。'); return; }
  if (!essay)       { showError('请先输入作文内容。'); return; }
  if (essay.length < 20) { showError('作文太短，请输入至少20个字。'); return; }
  hideError();

  const loadingEl = document.getElementById('loading');
  const btnEl     = document.getElementById(draft===1?'submitBtn':'draft2Btn');
  const btnTextEl = document.getElementById(draft===1?'btnText':null);
  loadingEl.classList.add('visible');
  btnEl.disabled = true;
  if (btnTextEl) btnTextEl.textContent = '批改中…';

  const msgs = ['正在仔细阅读作文…','分析语法与用词…','整理批改意见…','即将完成…'];
  let li=0;
  const t = setInterval(()=>{ document.getElementById('loadingText').textContent=msgs[li++%msgs.length]; },1800);

  const mode = MODES[currentMode];
  try {
    const res = await fetch(WORKER_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'feedback', essay, mode:currentMode, goal:currentGoal,
        logData:{ sessionId:SESSION_ID, studentName, draft, mode:currentMode, essay }
      })
    });
    clearInterval(t);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error?.message || '请求失败，请重试。');
    if (!data.feedback?.macro || !Array.isArray(data.feedback?.micro)) throw new Error('反馈格式无效，请重试。');
    const feedback = data.feedback;
    loadingEl.classList.remove('visible');

    if (draft===1) {
      draft1Feedback = feedback;
      const badge = document.getElementById('modeBadge');
      badge.textContent = mode.label; badge.className = 'mode-badge ' + mode.badge;
      document.getElementById('resultMeta').textContent = `共${essay.length}字`;
      document.getElementById('resultContent').innerHTML = renderFeedback(feedback, draft);
      document.getElementById('resultSection').classList.add('visible');
      updateGoalResults();
      awardLocalReward('seeds', 1, 'draft:1', '🌰 完成一稿，获得 1 颗写作种子！');
      document.getElementById('resultSection').scrollIntoView({behavior:'smooth',block:'start'});
    } else {
      draft2Feedback = feedback;
      const badge2 = document.getElementById('modeBadge2');
      badge2.textContent = mode.label+'（二稿）'; badge2.className = 'mode-badge '+mode.badge;
      document.getElementById('resultMeta2').textContent = `共${essay.length}字`;
      document.getElementById('resultContent2').innerHTML = renderFeedback(feedback, draft);
      document.getElementById('result2Section').classList.add('visible');
      updateGoalResults();
      awardLocalReward('water', 2, 'draft:2', '💧 完成二稿，获得 2 滴水，菜苗长大了！');
      document.getElementById('result2Section').scrollIntoView({behavior:'smooth',block:'start'});
    }
  } catch(err) {
    clearInterval(t);
    loadingEl.classList.remove('visible');
    showError('错误：'+err.message);
  }
  btnEl.disabled = false;
  if (btnTextEl) btnTextEl.textContent = '获取反馈';
}

function showGrowthComparison(firstFeedback, secondFeedback) {
  const firstIssues = firstFeedback.micro?.length || 0;
  const secondIssues = secondFeedback.micro?.length || 0;
  const resolved = Math.max(0, firstIssues - secondIssues);
  const message = resolved > 0
    ? `你在二稿里减少了 ${resolved} 个需要优先修改的问题。`
    : '你完成了二稿并重新检查了自己的表达，这就是写作成长。';
  document.getElementById('compBars').innerHTML = `<div class="growth-result"><span class="growth-icon">🥬</span><strong>菜苗又长高了一点！</strong><p>${escapeHtml(message)}</p></div>`;
  document.getElementById('compSummary').textContent = '没有分数，只有你真正完成的每一次修改。';
  document.getElementById('comparison').classList.add('visible');
}

function showScoreComparison(firstFeedback, secondFeedback) {
  const firstScores = getScores(firstFeedback);
  const secondScores = getScores(secondFeedback);
  if (!firstScores || !secondScores) return showGrowthComparison(firstFeedback, secondFeedback);
  const bars = firstScores.map((score, index) => {
    const first = score.val;
    const second = secondScores[index].val;
    const diff = second - first;
    const deltaClass = diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-same';
    const deltaText = diff > 0 ? `↑${diff}` : diff < 0 ? `↓${Math.abs(diff)}` : '→';
    return `<div class="comp-row"><div class="comp-label">${score.label}</div><div class="comp-bars"><div class="bar-wrap"><div class="bar-tag">一稿</div><div class="bar-bg"><div class="bar-fill b1" style="width:${first * 10}%"></div></div><div class="bar-num">${first}</div></div><div class="bar-wrap"><div class="bar-tag">二稿</div><div class="bar-bg"><div class="bar-fill b2" style="width:${second * 10}%"></div></div><div class="bar-num">${second}</div></div></div><span class="comp-delta ${deltaClass}">${deltaText}</span></div>`;
  }).join('');
  const firstTotal = firstScores.reduce((sum, score)=>sum + score.val, 0);
  const secondTotal = secondScores.reduce((sum, score)=>sum + score.val, 0);
  const change = secondTotal - firstTotal;
  document.getElementById('compBars').innerHTML = bars;
  document.getElementById('compSummary').textContent = change > 0
    ? `AI 模拟总分提升 ${change} 分：${firstTotal}/30 → ${secondTotal}/30。`
    : `AI 模拟评分：${firstTotal}/30 → ${secondTotal}/30。请结合具体反馈继续修改。`;
  document.getElementById('comparison').classList.add('visible');
}

// Check teacher feedback
async function checkTeacherFeedback() {
  const studentName = document.getElementById('studentName').value.trim();
  if (!studentName) { alert('请先填写姓名。'); return; }
  try {
    const res = await fetch(`${WORKER_URL}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'getTeacherFeedback', sessionId: SESSION_ID })
    });
    const data = await res.json();
    if (data.annotations && data.annotations.length > 0) {
      const body = document.getElementById('teacherBody');
      body.innerHTML = data.annotations.map(a => `
        <div class="anno-item">
          <span class="anno-tag tag-${a.type}">${a.type}</span><br>${a.text}
        </div>`).join('');
      document.getElementById('teacherSection').classList.add('visible');
      document.getElementById('teacherSection').scrollIntoView({behavior:'smooth'});
    } else {
      alert('老师还未批注，请稍后再查看。');
    }
  } catch(e) { alert('查询失败，请稍后重试。'); }
}

function copyResult(id) {
  navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert('已复制！'));
}

function clearAll() {
  document.getElementById('essayInput').value='';
  updateCount(); hideError();
  ['resultSection','result2Section','draft2Section','comparison','teacherSection'].forEach(id=>{
    document.getElementById(id).classList.remove('visible');
  });
  document.getElementById('loading').classList.remove('visible');
  draft1Feedback=null;
  draft2Feedback=null;
  updateGoalResults();
}

// ── Camera ──
async function openCamera() {
  document.getElementById('cameraModal').classList.add('visible');
  document.getElementById('cameraPreview').style.display='none';
  document.getElementById('cameraVideo').style.display='block';
  document.getElementById('camStatus').textContent='正在启动摄像头…';
  document.getElementById('camBtns').innerHTML=`<button class="cam-btn cam-snap" onclick="snapPhoto()">📸 拍照</button><button class="cam-btn cam-cancel" onclick="closeCamera()">取消</button>`;
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment'}, audio:false });
    document.getElementById('cameraVideo').srcObject = cameraStream;
    document.getElementById('camStatus').textContent='对准作文，点击拍照。';
  } catch(e) {
    document.getElementById('camStatus').textContent='无法启动摄像头：'+e.message;
  }
}

function snapPhoto() {
  const video  = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  capturedImage = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
  document.getElementById('cameraPreview').src = 'data:image/jpeg;base64,'+capturedImage;
  document.getElementById('cameraPreview').style.display='block';
  document.getElementById('cameraVideo').style.display='none';
  document.getElementById('camBtns').innerHTML=`<button class="cam-btn cam-retake" onclick="retakePhoto()">🔄 重拍</button><button class="cam-btn cam-use" onclick="usePhoto()">✓ 使用这张</button>`;
  document.getElementById('camStatus').textContent='确认照片清晰后点「使用这张」。';
}

function retakePhoto() {
  document.getElementById('cameraPreview').style.display='none';
  document.getElementById('cameraVideo').style.display='block';
  document.getElementById('camBtns').innerHTML=`<button class="cam-btn cam-snap" onclick="snapPhoto()">📸 拍照</button><button class="cam-btn cam-cancel" onclick="closeCamera()">取消</button>`;
  capturedImage=null;
}

async function usePhoto() {
  if (!capturedImage) return;
  document.getElementById('camLoading').style.display='block';
  document.getElementById('camBtns').style.display='none';
  document.getElementById('camStatus').textContent='';
  try {
    const res = await fetch(WORKER_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'ocr', imageData:capturedImage, mediaType:'image/jpeg' })
    });
    const data = await res.json();
    closeCamera();
    if (data.text && !data.text.includes('无法识别')) {
      document.getElementById('essayInput').value = data.text;
      updateCount();
    } else {
      alert(data.text || '识别失败，请重新拍摄。');
    }
  } catch(e) {
    closeCamera();
    alert('识别出错，请重试。');
  }
}

function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  document.getElementById('cameraModal').classList.remove('visible');
  document.getElementById('camLoading').style.display='none';
  document.getElementById('camBtns').style.display='flex';
  capturedImage=null;
}

updateGardenUI();
</script>
